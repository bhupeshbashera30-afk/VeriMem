[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verimem"
version = "0.1.0"
description = "VeriMem: Hallucination-Aware Agentic Memory System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "chromadb",
    "sentence-transformers",
    "google-generativeai"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
